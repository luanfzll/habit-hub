name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the code; the GITHUB_TOKEN gets nothing more (flagged by CodeQL).
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: habithub
          POSTGRES_PASSWORD: habithub
          POSTGRES_DB: habithub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habithub -d habithub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://habithub:habithub@localhost:5432/habithub
      TEST_DATABASE_URL: postgresql://habithub:habithub@localhost:5432/habithub_test
      BETTER_AUTH_SECRET: ci-only-secret-never-used-outside-this-workflow
      BETTER_AUTH_URL: http://localhost:3100
      EMAIL_TRANSPORT: console
      # The end-to-end tests create accounts against a production build.
      SIGNUP_ALLOWLIST: "*"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create the integration test database
        run: psql "postgresql://habithub:habithub@localhost:5432/habithub" -c "CREATE DATABASE habithub_test"

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (two time zones)
        run: npm run test:unit

      - name: Integration tests (two time zones)
        run: npm run test:integration

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
